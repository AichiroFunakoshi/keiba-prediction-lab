[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-prediction-lab"
version = "0.1.0"
description = "Reproducible evaluation tools for horse-racing prediction research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["lxml>=5,<7"]
license = { text = "MIT" }
authors = [{ name = "Aichiro Funakoshi" }]

[project.scripts]
keiba-lab = "keiba_prediction_lab.cli:main"
raceweave = "keiba_prediction_lab.desktop_app:main"

[project.optional-dependencies]
desktop = [
  "pillow>=11,<13",
  "pyinstaller>=6,<7",
  "pywebview>=5,<7",
]

[tool.setuptools.package-data]
keiba_prediction_lab = ["static/*.html", "static/*.css", "static/*.js"]
